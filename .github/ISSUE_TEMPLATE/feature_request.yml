## Feature Description

A clear and concise description of the feature you'd like to see.

## Use Case

Describe the problem this feature would solve. Who would benefit from this?

## Proposed Solution

Describe how you envision this feature working. Include API shapes, endpoints, or behavior if applicable.

## Alternative Solutions

Describe any alternative solutions or workarounds you've considered.

## Provider Information (if adding a new mock)

- **Provider name:** 
- **API documentation URL:** 
- **OpenAPI spec URL (if available):** 
- **Authentication type:** (Bearer, API Key, OAuth, etc.)
- **Key endpoints needed:** 
- **Category:** (payments, email, analytics, etc.)

## Additional Context

Add any other context, mocks, screenshots, or references here.

## Checklist

- [ ] I have searched existing issues for duplicates
- [ ] This aligns with the project's goals (zero deps, real shapes, reference-decides)
- [ ] I'm willing to help implement this