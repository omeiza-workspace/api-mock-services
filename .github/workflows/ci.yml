name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check the house style
        run: npm run lint

  tests:
    name: Tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Run the test suite
        run: npm test

  package:
    name: Package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check what would be published
        run: npm pack --dry-run

  footprint:
    name: Footprint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check the mocks are still light
        run: npm run footprint

  image:
    name: Container image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the image
        run: docker build -f docker/Dockerfile -t api-mock-services .
      - name: Smoke test the image
        run: |
          docker run --rm -d --name mock -p 4001:4001 api-mock-services stripe
          sleep 3
          curl -fsS http://127.0.0.1:4001/health
          curl -fsS http://127.0.0.1:4001/_panel | head -c 60
          docker rm -f mock
