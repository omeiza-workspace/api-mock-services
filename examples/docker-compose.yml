# The mocks, as containers.
#
# Copy this into a project and use it with:
#
#   docker compose -f docker-compose.yml up -d
#
# The stack is grouped into profiles, so a project only starts what it
# needs. Starting everything costs eighteen containers; starting a category
# costs two or three.
#
#   docker compose -f docker-compose.yml --profile payments up -d
#   docker compose -f docker-compose.yml --profile identity up -d
#   docker compose -f docker-compose.yml --profile messaging up -d
#   docker compose -f docker-compose.yml --profile ai up -d
#   docker compose -f docker-compose.yml --profile storage up -d
#   docker compose -f docker-compose.yml --profile all up -d
#
# The lightest way of all is one container holding several mocks — one
# process, one image, several ports:
#
#   docker run --rm -p 4001:4001 -p 4005:4005 api-mock-services stripe paystack
#
# The image is built once, from this package, and every mock runs from it —
# so there is one implementation of each service, not one per project.

x-mock: &mock
  build:
    context: ..
    dockerfile: docker/Dockerfile
  restart: "no"
  deploy:
    resources:
      limits:
        memory: 128M

services:
  # ── Payments ────────────────────────────────────────────────────────────
  stripe-mock:
    <<: *mock
    profiles: [payments, all]
    command: ["stripe"]
    ports:
      - "4001:4001"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:4001/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  paystack-mock:
